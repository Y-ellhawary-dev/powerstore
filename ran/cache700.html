<!DOCTYPE html>
<html manifest="700.manifest">
<head>
    <title>PowerStore PS4 PS5 - Cache 7.00-8.52</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="name-powerstore">PowerStore</span>
                <span class="ps4-title">PS4</span>
                <span class="ps5-title">PS5</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 7.00 - 8.52</div>
        </header>
        
        <hr class="separator">
        
        <div class="status-bar">
            <h1 id="msgs"><span class="red-status">⏳ Starting Cache Installation...</span></h1>
        </div>
        
        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">PowerStore</a></p>
            <p class="thanks">❤️ Special thanks to all scene developers</p>
        </footer>
    </div>

    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);
        
        var msgs = document.getElementById('msgs');
        
        function DLProgress(e) {
            var Percent = Math.round(e.loaded / e.total * 100);
            msgs.innerHTML = '<span class="red-status">Installing Offline Cache: ' + Percent + '%</span>';
        }
        
        function DisplayCacheProgress() {
            msgs.innerHTML = '<span class="gold-status">Cache Installed Successfully ✔</span>';
            setTimeout(function() {
                msgs.innerHTML = '<span class="red-status">Now Close And Re-Open Your Browser ...</span>';
            }, 1500);
        }
        
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onerror = function(e) {
            msgs.innerHTML = '<span class="red-status">Error Installing Cache! - Clear and Re-Open Your Browser ...</span>';
        };
    </script>
</body>
</html>
