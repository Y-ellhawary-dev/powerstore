<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerStore PS4 PS5 Exploit Host</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="menu">
        <div class="title-container">
            <h1 class="main-title">
                <span class="name-powerstore">PowerStore</span>
                <span class="ps4-title">PS4</span>
                <span class="ps5-title">PS5</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 7.00 - 13.00</div>
        </div>
        
        <hr>

        <h1 id="msgs">
            <span class="red-status">Detecting Firmware... Please Wait</span>
        </h1>
        
        <h1 style="margin-top: 30px; font-size: 16px; color: #ddd;">
            Designed by: <a href="#" style="color: #ffd700; margin: 0 10px;">PowerStore</a>
            <br>
            <span class="thanks">A special thanks to all the devs on the scene.</span>
        </h1>
    </div>

    <script>
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        var msgs = document.getElementById('msgs');

        function showError(msg) {
            msgs.innerHTML = '<span class="red-status">' + msg + '</span>';
        }

        window.onerror = function(msg, url, line) {
            showError("Exploit Error: " + msg);
            return true;
        };

        if (!isPS4) {
            document.addEventListener("DOMContentLoaded", function() {
                showError("Only for PS4 with Firmware 7.00 to 13.00");
            });
        } else {
            if (window.applicationCache && window.applicationCache.status == 0) {
                if (fwNum >= 7.00 && fwNum <= 8.52) {
                    msgs.innerHTML = '<span class="gold-status">Installing Cache for FW ' + fwVersion + '...</span>';
                    setTimeout(function() { window.location.replace("cache700.html"); }, 800);
                } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    msgs.innerHTML = '<span class="gold-status">Installing Cache for FW ' + fwVersion + '...</span>';
                    setTimeout(function() { window.location.replace("cache900.html"); }, 800);
                } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    msgs.innerHTML = '<span class="gold-status">Installing Cache for FW ' + fwVersion + '...</span>';
                    setTimeout(function() { window.location.replace("cachecss.html"); }, 800);
                } else if (fwNum >= 11.50 && fwNum <= 13.00) {
                    msgs.innerHTML = '<span class="gold-status">Installing Cache for FW ' + fwVersion + '...</span>';
                    setTimeout(function() { window.location.replace("cacheslopkit.html"); }, 800);
                } else {
                    document.addEventListener("DOMContentLoaded", function() {
                        showError('Unsupported Firmware: ' + fwVersion);
                    });
                }
            } else {
                setTimeout(function() {
                    try {
                        if (fwNum >= 7.00 && fwNum <= 8.52) {
                            msgs.innerHTML = '<span class="red-status">Loading Exploit for FW ' + fwVersion + '...</span>';
                            var script = document.createElement('script');
                            script.type = 'module';
                            script.src = "700/alert.js";
                            script.onerror = function() { showError("Content not Found! Check Cache."); };
                            document.head.appendChild(script);
                        }
                        else if (fwNum >= 9.00 && fwNum <= 9.60) {
                            msgs.innerHTML = '<span class="red-status">Loading Exploit for FW ' + fwVersion + '...</span>';
                            var script = document.createElement('script');
                            script.type = 'module';
                            script.src = "900/alert.js";
                            script.onerror = function() { showError("Content not Found! Check Cache."); };
                            document.head.appendChild(script);
                        }
                        else if (fwNum >= 10.00 && fwNum <= 11.02) {
                            msgs.innerHTML = '<span class="red-status">Loading Exploit for FW ' + fwVersion + '...</span>';
                            var script = document.createElement('script');
                            script.src = "css/main.js";
                            script.onerror = function() { showError("Content not Found! Check Cache."); };
                            script.onload = function () {
                                setTimeout(function () { if (typeof doJb === 'function') doJb(); }, 500);
                            };
                            document.head.appendChild(script);
                        }
                        else if (fwNum >= 11.50 && fwNum <= 13.00) {
                            msgs.innerHTML = '<span class="red-status">Loading Exploit for FW ' + fwVersion + '...</span>';
                            var script = document.createElement('script');
                            script.type = 'module';
                            script.src = "slopkit/chain_lapse.js";
                            script.onerror = function() { showError("Content not Found! Check Cache."); };
                            document.head.appendChild(script);
                        }
                    } catch (err) {
                        showError("Failed to trigger exploit: " + err.message);
                    }
                }, 800);
            }
        }
    </script>
</body>
</html>
